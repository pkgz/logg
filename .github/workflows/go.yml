name: Code coverage
on: [push, pull_request]
jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
      id: go

    - name: gofmt
      run: test -z "$(gofmt -l .)" || (echo "Run gofmt to format the following files:" && gofmt -l . && exit 1)

    - name: vet
      run: go vet ./...

    - name: Test
      run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{secrets.CODECOV_TOKEN}}
        file: ./coverage.out
